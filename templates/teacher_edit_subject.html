{% extends "teacher_layout.html" %} 

{% block content %}
<style>
    .container {
        max-width: 800px;
        display: flex; /* Use flexbox for layout */
        justify-content: space-between; /* Space between the two sections */
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-control {
        font-size: 16px;
        padding: 10px;
        border-radius: 5px;
    }
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        color: #fff;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 5px;
        transition: background-color 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }
    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004494;
    }

    .header {
        margin-bottom: 30px;
        text-align: center;
        width: 100%; /* Ensures header spans the full width */
    }
    .header h2 {
        font-size: 32px;
        font-weight: 700;
        color: #003366;
        margin: 0;
    }

    /* Styles for the new features section */
    .features-container {
        margin-left: 20px; /* Space between the two sections */
        width: 400px; /* Fixed width for the features section */
    }

    .features-container h3 {
        margin-bottom: 15px;
        font-size: 24px;
        color: #003366;
    }

    /* Table styles */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        padding: 8px;
        text-align: left;
        border: 1px solid #ccc;
    }
    th {
        background-color: #f4f4f4;
    }
</style>

<div class='header'>
    <h2>Edit Subject</h2>
</div>
<div class="container">
    <!-- Existing form -->
    <div>
        <form method="POST">
            <div class="form-group">
                <label for="name">Subject Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ subject.name }}" required>
            </div>
            <div class="form-group">
                <label for="subject_code">Subject Code</label>
                <input type="text" id="subject_code" name="subject_code" class="form-control" value="{{ subject.subject_code }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4" required>{{ subject.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="semester">Semester</label>
                <input type="text" id="semester" name="semester" class="form-control" value="{{ subject.semester }}" required>
            </div>

            <button type="submit" class="btn btn-primary">Update Subject</button>
        </form>
    </div>

    <!-- New Features Section for Adding/Removing Students -->
    <div class="features-container">
        <h3>Manage Students</h3>

        <!-- Batch Year Filter -->
        <div class="form-group">
            <label for="filter_batch_year">Filter by Batch Year</label>
            <select id="filter_batch_year" class="form-control" onchange="filterStudents()">
                <option value="">All Batch Years</option>
                {% for year in distinct_years %}
                    <option value="{{ year }}">{{ year }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Student Table -->
        <form method="POST" action="/teacher_add_students_to_subject">
             <input type="hidden" name="subject_id" value="{{ subject.id }}">  <!-- Ensure subject.id is set -->
            <table id="student_table">
                <thead>
                    <tr>
                        <th>
                            <input type="checkbox" id="select_all" onclick="toggleSelectAll(this)"> Select All
                        </th>
                        <th>Name</th>
                        <th>ID</th>
                        <th>Semester</th>
                        <th>Batch Year</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in all_students %}
                        <tr>
                            <td>
                                <input type="checkbox" name="selected_students" value="{{ student.id }}"
                                    {% if student.id in subject_student_ids %}checked{% endif %}>
                            </td>
                            <td>{{ student.name }}</td>
                            <td>{{ student.id }}</td>
                            <td>{{ student.semester }}</td>
                            <td>{{ student.batch_year }}</td> <!-- Update this to match your student attribute -->
                        </tr>
                    {% endfor %}
                </tbody>
            </table>

            <!-- Button to Add Selected Students -->
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>

<script>
    function filterStudents() {
        const batchYear = document.getElementById('filter_batch_year').value;
        const rows = document.getElementById('student_table').getElementsByTagName('tbody')[0].getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const batchYearCell = rows[i].getElementsByTagName('td')[4].innerText;

            const isBatchYearMatch = (batchYear === "" || batchYearCell === batchYear);

            if (isBatchYearMatch) {
                rows[i].style.display = "";
            } else {
                rows[i].style.display = "none";
            }
        }
    }

    function toggleSelectAll(source) {
        const rows = document.getElementById('student_table').getElementsByTagName('tbody')[0].getElementsByTagName('tr');
        
        for (let i = 0; i < rows.length; i++) {
            // Check if the row is visible
            if (rows[i].style.display !== "none") {
                const checkbox = rows[i].getElementsByTagName('input')[0]; // Get the checkbox in the row
                checkbox.checked = source.checked; // Set the checkbox to the state of the "Select All"
            }
        }
    }
</script>

{% endblock %}
