{% extends "teacher_layout.html" %}

{% block content %}
<style>
    .container {
        max-width: 800px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-control {
        font-size: 16px;
        padding: 10px;
        border-radius: 5px;
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        color: #fff;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 5px;
        transition: background-color 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004494;
    }

    .header {
        margin-bottom: 30px;
        text-align: center;
    }

    .header h2 {
        font-size: 32px;
        font-weight: 700;
        color: #003366;
        margin: 0;
    }
</style>

<div class='header'>
    <h2>Edit Assignment</h2>
</div>

<div class="container">
    <div class="card shadow-lg">
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="title">Assignment Title</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ assignment.title }}" placeholder="Enter assignment title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="4" placeholder="Enter assignment description" required>{{ assignment.description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="due_date">Due Date & Time</label>
                    {% if assignment.due_date %}
                        <input type="datetime-local" id="due_date" name="due_date" class="form-control" value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') }}" required>
                    {% else %}
                        <input type="datetime-local" id="due_date" name="due_date" class="form-control" placeholder="Select due date and time" required>
                    {% endif %}
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
