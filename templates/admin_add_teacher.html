{% extends "admin_layout.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}
<h2 style="font-size: 24px; margin-bottom: 20px; color: #333;"><center>Add Teacher<center/></h2>
<form action="{{ url_for('admin_add_teacher') }}" method="post" style="max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <div style="margin-bottom: 15px;">
        <label for="username" style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Username:</label>
        <input type="text" id="username" name="username" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Password:</label>
        <input type="password" id="password" name="password" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Email:</label>
        <input type="email" id="email" name="email" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
    </div>

    <div style="margin-bottom: 15px;">
        <label for="department" style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Department:</label>
        <input type="text" id="department" name="department" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
        Add Teacher
    </button>
</form>
{% endblock %}
