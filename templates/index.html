<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubmissionHub - Welcome</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero-section {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            padding: 60px 40px;
            text-align: center;
            margin-top: 60px;
            margin-bottom: 60px;
        }

        .hero-section h1 {
            font-size: 2.75rem;
            margin-bottom: 20px;
            color: #002244;
        }

        .hero-section p {
            font-size: 1.25rem;
            color: #555;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px;
            color: #fff;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-primary {
            background-color: #003366;
        }

        .btn-primary:hover {
            background-color: #002244;
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: #007bff;
        }

        .btn-secondary:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        footer {
            background-color: #003366;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 16px;
            margin-top: 60px;
            border-top: 2px solid #002244;
        }

        @media (max-width: 768px) {
            .hero-section {
                padding: 40px 20px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 16px;
            }

            .hero-section h1 {
                font-size: 2.25rem;
            }

            .hero-section p {
                font-size: 1.125rem;
            }
        }
    </style>
</head>
<body>

    <header>
        SubmissionHub
    </header>

    <div class="container">
        <div class="hero-section">
            <h1>Welcome to SubmissionHub</h1>
            <p>Your gateway to secure, easy, and efficient assignment submissions.</p>
            <a href="/student_login" class="btn btn-primary">Student Login</a>
            <a href="/teacher_login" class="btn btn-primary">Teacher Login</a>
            <a href="/admin_login" class="btn btn-secondary">Admin Login</a>
        </div>
    </div>

    <footer>
        &copy; 2024 SubmissionHub. All rights reserved.
    </footer>

</body>
</html>
